# NT4 (Nemotron-4) Nano text-only GRPO on the single-controller path, with vLLM
# generation.
#
# Why text-only for a multimodal checkpoint: the NM4 vLLM fork registers
#   "Nemotron4ForConditionalGeneration": ("nemotron4", "Nemotron4ForCausalLM")
# and that class is `(nn.Module, SupportsPP, IsHybrid)` -- not SupportsMultiModal.
# Its weight mapper sends "model.vision_tower." and "model.multi_modal_projector."
# to None, i.e. it loads the multimodal checkpoint and discards the Pixtral tower
# and the projector. So vLLM can serve NM4's language model but has no image path
# at all; this matches the fork's own README, which does not certify vision. Image
# GRPO therefore has to wait for vision support upstream -- see the CLEVR sibling
# recipe for that path, which is blocked on a separate Megatron-core protocol gap.
#
# This recipe exists to pipeclean everything that is not vision: NM4 model build,
# megatron_bridge checkpoint load, Megatron -> vLLM refit across a mismatched
# expert layout, rollout, advantage and the optimizer step.
#
# The parent lives under recipes/vlm/ because it carries the only NM4 training
# block known to work (ported from Rohit's nm4_clevr_4n SFT recipe); everything
# this file overrides is downstream of that. The parent's own `data` block is a
# CLEVR overlay on grpo_math_1B.yaml, which is also the root of the text recipes,
# so restoring text training is a matter of putting `data` and `env` back.
#
# Launch with:
#   bash pipeclean-v2/launch_nt4nano_math_vllm_8n.sh
# ---------------------------------------------------------------------------------
defaults: ../vlm/vlm_grpo-nt4nano-clevr-8n4g-megatron-single-controller-async.v1.yaml

policy:
  # The parent sets this true, which builds an AutoProcessor instead of a plain
  # tokenizer -- and `nemo_rl/data/utils.py` then forces *every* declared
  # environment to VLMEnvironment ("vlm" if is_vlm else env_name), so the math
  # env was constructed as a VLM env and died on the reward_functions key it
  # does not have. The tokenizer path still points at the NT4 processor
  # directory, which carries tokenizer.json and tokenizer_config.json, so
  # AutoTokenizer loads it fine without the image side.
  is_vlm: false
  # No attention backend in this image can train NM4's head_dim 256 on packed
  # sequences. Asking Transformer Engine directly (see
  # pipeclean-v2/nm4-bridge/probe_attn_backend.py) gives, at head_dim 256:
  #   cuDNN -- forward only. The backward reports no supporting backend, for
  #            thd and sbhd alike; at head_dim 128 it trains, so the head
  #            dimension is the constraint.
  #   FA4   -- offered everywhere, but its SM100 forward kernel asserts on
  #            seqused_q/seqused_k, which only thd supplies.
  #   FA2   -- would take head_dim 256 on sm100, but is disabled for thd
  #            whenever sequences are padded apart, which packing always does.
  #   FA3   -- sm90 only.
  # FlashAttention 4 on unpacked sequences is the one combination left. And
  # megatron/setup.py requires packing whenever context parallelism is on,
  # because CP needs cu_seqlens through PackedSeqParams -- so dropping packing
  # means dropping CP with it. Both go, together, for that single reason.
  #
  # This is not how the NM4 team trains the model; it is what this image can
  # run. Revisit when cuDNN grows a head_dim 256 backward or FA4 accepts
  # seqused on SM100, at which point CP 16 and packing both come back.
  sequence_packing:
    enabled: false
  # Nothing here needs 32 once CP is gone -- Megatron's floor drops with
  # cp_size -- but a multiple of 32 satisfies every pad factor in play and
  # keeps the sequence length friendly to the kernels.
  make_sequence_length_divisible_by: 32
  # Both training and generation now name the real NM4 HF export. The parent
  # points this at an unrelated stand-in because AutoConfig cannot read
  # model_type "nemotron4" and AutoBridge has no NM4 mapping; both gaps are
  # closed by nemo_rl/models/megatron/nemotron4, which the Megatron setup
  # imports. The export is only ever read for its config and parameter names --
  # weights still come from the megatron_bridge checkpoint.
  model_name: ${oc.env:NT4_NANO_HF_CKPT,/lustre/fsw/portfolios/nemotron/users/tbarnatan/models/nm4/nemotron4-nano-wsm-vlm}
  megatron_cfg:
    # Forced to 1 by the attention-backend situation above, not chosen. The 16
    # training GPUs become data parallel instead, which keeps expert
    # parallelism at 16 and, as a side effect, finally gives the distributed
    # optimizer a data-parallel group to shard its state over -- at CP 16 the
    # data-parallel size was 1, so it sharded over nothing. That offsets the
    # extra activation memory from each rank now holding a whole 8192-token
    # sequence rather than a sixteenth of one.
    context_parallel_size: 1
  generation:
    backend: "vllm"
    # The parent pins refit_transport=mcore, which moves weights Megatron to
    # Megatron and never needs HF names. No vLLM transport can do that: they all
    # export through AutoBridge.export_hf_weights, which is what the NM4 bridge
    # now makes possible.
    refit_transport: null
    model_name: ${policy.model_name}
    # The image ships nvidia-cutlass-dsl 4.6.2 against quack-kernels 0.6.5, and
    # quack still imports `cutlass.base_dsl.enums.Arch`, which 4.6.2 moved to
    # `cutlass.base_dsl.arch`. Every warmup path that reaches quack therefore
    # dies with ModuleNotFoundError before the engine finishes starting. Both
    # paths are pure ahead-of-time compilation of MoE router GEMMs, so turning
    # them off costs first-token latency and nothing else.
    vllm_kwargs:
      kernel_config:
        enable_jit_warmup: false
        enable_cutedsl_warmup: false
    vllm_cfg:
      async_engine: true
      # The parallelism the NM4 team validated (`vllm serve --tensor-parallel-size 2`).
      # Experts shard across the TP ranks; EP stays 1, matching their serving config.
      tensor_parallel_size: 2
      expert_parallel_size: 1
      # ~194 GB of bf16 weights over TP2 is ~97 GB per GPU. The 0.6 default leaves
      # too little of a 189 GB GB200 for KV cache once weights land.
      gpu_memory_utilization: 0.85
    colocated:
      enabled: false
      resources:
        num_nodes: 4
        gpus_per_node: 4

# Back to text: the parent's CLEVR overlay is replaced by the math task from
# grpo_math_1B.yaml at the root of both chains. The parent's `env.clevr-cogent`
# block is left declared but unused, since `env_name` selects math.
data:
  train:
    dataset_name: OpenMathInstruct-2
    split_validation_size: 0.05
    seed: ${grpo.seed}
  validation: null
  default:
    prompt_file: "examples/prompts/cot.txt"
    system_prompt_file: null
    processor: "math_hf_data_processor"
    env_name: "math"

env:
  math:
    num_workers: 8
    math_verify_impl: "hf_math_verify"

grpo:
  max_num_steps: 5
  num_prompts_per_step: 8
  num_generations_per_prompt: 8

cluster:
  gpus_per_node: 4
  # 4 training nodes (TP1 x CP16 x EP16 = 16 GPUs) plus 4 generation nodes
  # (16 GPUs = eight TP2 vLLM replicas). Generation needs only one node for
  # capacity, but ray.sub declares `#SBATCH --segment=8`, so Slurm requires the
  # node count to be a multiple of 8.
  num_nodes: 8

logger:
  log_dir: logs/grpo-nt4nano-math-8n4g-vllm-single-controller-async
  wandb:
    name: grpo-nt4nano-math-8n4g-vllm-single-controller-async
