# NT4 (Nemotron-4) Nano text RLVR on NeMo-Gym, with the external judge fleet.
#
# Shaped after examples/nemo_gym/nemotron-3.5-lightning/rlvr.yaml. The 86-node
# allocation is Lightning's and carries over unchanged:
#
#   Training:          32 nodes (128 GPUs)
#   Policy vLLM:       32 nodes (128 GPUs)
#   Gym safety judge:   2 nodes (  8 GPUs; TP=4, DP=2)
#   External GenRM:    16 nodes ( 64 GPUs; eight TP=8 replicas)
#   External NL2Bash:   4 nodes ( 16 GPUs; four TP=4 replicas)
#
# Lightning's *training* shape does not carry over, and cannot:
#
#   TP 4  -- NM4 Nano has num_key_value_heads=1 and Megatron requires the query
#            group count to divide the tensor parallel size. TP is 1 or nothing.
#   CP 4  -- context parallelism requires sequence packing, and no attention
#            backend in this image trains head_dim 256 on packed sequences. See
#            the parent recipe for the full backend matrix.
#   73728 -- the checkpoint's max_position_embeddings is 8192. Longer needs RoPE
#            extension, which is not a thing to do inside a validation run.
#
# So the training half stays exactly as the 32n4g math pipeclean left it:
# TP1/CP1/EP64, unpacked, 8192 tokens. That configuration is proven -- it ran
# five GRPO steps end to end with the sampling importance ratio inside 0.2% of
# 1.0 on every step -- and everything it encodes about NM4 (FlashAttention 2 for
# head_dim 256, the 512-expert MoE block, Muon, MTP depth 2, the refit buffer
# behaviour) is inherited rather than restated here.
#
# What is new is the gym path and the judge fleet. Checkpoints are the ones the
# Super 3.5 production text RLVR stage uses (launch_rlvr_v43.sh in
# post-training/pipeline); the launcher resolves them, this file only names the
# servers.
# ---------------------------------------------------------------------------------
defaults: ../../configs/recipes/llm/grpo-nt4nano-math-32n4g-vllm-single-controller-async.v1.yaml

# =============================================================================
# Cluster -- Ray nodes only. The 22 judge nodes are a separate Slurm hetgroup
# and are not counted here, matching Lightning.
# =============================================================================
cluster:
  gpus_per_node: 4
  # Training plus generation. The launcher overrides this with the same sum and
  # places the two gym nodes on top, for 66 Ray nodes in hetgroup 0.
  num_nodes: 64
  # 2, unlike the 8 the earlier NM4 runs used. The segment size has to divide
  # the Ray allocation, and that is 66 once the gym nodes are included, which 8
  # does not divide. A constraint of the shape rather than a preference.
  segment_size: 2

# =============================================================================
# GRPO
# =============================================================================
grpo:
  # Production is 512 x 16 (a global batch of 8192). This is deliberately a
  # quarter of that for a first run through an untried path: 128 x 8 still
  # pushes 1024 sequences a step through every judge, which is enough to see
  # the fleet work, and it gets to step 1 in a fraction of the time.
  num_prompts_per_step: 128
  num_generations_per_prompt: 8
  max_num_steps: 10
  max_rollout_turns: 1
  normalize_rewards: true
  use_leave_one_out_baseline: true
  advantage_clip_low: -20
  advantage_clip_high: 20
  val_period: 0
  val_at_start: false
  val_at_end: false
  # Gym takes the validation set exactly as given and sizes both of these from
  # it, so it rejects a non-null max_val_samples outright rather than silently
  # subsampling. The check runs before val_period is consulted, so the 256
  # inherited from grpo_math_1B.yaml kills the driver even though we never
  # validate. Lightning sets both the same way.
  max_val_samples: null
  val_batch_size: 256
  seed: 42
  # Rows whose tool calls come back malformed are penalised rather than
  # dropped, as in Lightning.
  penalize_invalid_tool_call: true
  invalid_tool_call_advantage: -5.0

loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  use_on_policy_kl_approximation: true
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  token_level_loss: true
  force_on_policy_ratio: true

# =============================================================================
# Policy
# =============================================================================
policy:
  # The tokenizer is inherited untouched (chat_template: default, no
  # chat_template_kwargs) and that is correct rather than merely unexamined:
  # NT4's template does `enable_thinking if enable_thinking is defined else
  # True`, so leaving the kwarg unset means thinking is on -- which is what the
  # policy_model block below asks the generation side for. Both halves agree.
  train_global_batch_size: 1024
  # defer_fp32_logits is already true in the parent, which is the precondition
  # for chunking the logprob pass. Worth having here: the vocabulary is 262272,
  # so the unchunked logit tensor is the single largest activation in the run.
  #
  # 256, not the 2048 that read as a safe default. The chunk size also sizes the
  # backward of the vocab-parallel logprob, where every per-chunk temporary is
  # chunk * 262272 * 4 bytes, so the knob scales that whole working set.
  #
  # The budget is what forces a small value. Step 1 fits comfortably, then Adam
  # materializes its state and from step 2 onward the process holds 182.63 GiB
  # of a 184.31 GiB GPU, leaving under 1.7 GiB for the backward to work in:
  # 7765260 completed step 1/10 and died in step 2 on a 1.00 GiB request. 256
  # keeps the peak well inside that, at the cost of 32 chunks per 8192-token
  # sequence instead of 16.
  logprob_chunk_size: 256

  megatron_cfg:
    # Turn off the multi-token-prediction head. The parent is a CLEVR SFT
    # training block, where mtp_num_layers 2 / mtp_loss_scaling_factor 0.3 are
    # deliberate; for GRPO the MTP term is inherited baggage. It adds a
    # next-next-token cross-entropy to the policy-gradient loss, which is not
    # the objective we are optimizing, and ENABLE_MTP_INFERENCE is 0 so the
    # head is not used for speculative decoding either. The RL recipes that
    # share this lineage agree: grpo-nanov3-30ba3b sets both to zero.
    #
    # It is also what made job 7758485 run out of memory one microbatch into
    # step 1/10. MTP's loss goes through fused_vocab_parallel_cross_entropy,
    # which materializes fp32 logits over the full 262272-vocab and does not
    # honour the logprob chunking above:
    #   8192 tokens x 262272 x 4 B = 8.0 GiB
    # against the 7.75 GiB allocation that actually failed, with 3.07 GiB free
    # of 184.31 GiB. train_micro_batch_size is already 1, so there was no
    # batch-size lever left -- this buffer is irreducible while MTP is on.
    #
    # The 32-node text pipeclean ran this same config with MTP enabled, which
    # is not a contradiction: its data file was capped at 4k, so the same
    # tensor was half the size and fit.
    mtp_num_layers: 0
    mtp_loss_scaling_factor: 0.0
    # mtp_use_repeated_layer is deliberately left at the inherited true. Setting
    # it false does not remove MTP, it changes the MTP layers from one shared
    # repeated layer into one distinct layer per depth -- weights this
    # checkpoint does not contain. Job 7761548 died on exactly that:
    # KeyError "language_model.mtp.layers.1...linear_fc1.weight from model not
    # in state dict".

    # mtp_hsm has to travel by a different road than the two keys above. MCore
    # raises "mtp_hsm=True requires mtp_num_layers >= 2", and
    # nemotron4_bridge.py sets mtp_hsm from the checkpoint's own architecture
    # (mtp_hsm=mtp_depths >= 2, and NM4 Nano's layer pattern ends in two MTP
    # depths), so it arrives True no matter what this recipe says. But
    # NeMo-RL's MegatronConfig TypedDict declares mtp_num_layers,
    # mtp_loss_scaling_factor and mtp_use_repeated_layer -- and not mtp_hsm --
    # so writing it alongside them is silently dropped. That is what happened
    # to job 7760082: it took mtp_num_layers=0, ignored mtp_hsm=false, and died
    # on the very error the key was added to prevent.
    #
    # model_overrides is the sanctioned channel for Megatron Bridge model
    # fields without a dedicated key (nemo_rl/models/megatron/setup.py). It is
    # merged into the provider before _apply_mtp_config and before finalize(),
    # so both halves of this fix land before validation. mtp_hsm only shapes
    # the MTP heads, so with MTP off it is inert.
    #
    # The other two MTP-dependent checks in MCore need nothing: the
    # hyper-connections conflict is gated on enable_mhc_connections, which NM4
    # never sets, and the overlap_moe_expert_parallel_comm assert accepts
    # mtp_num_layers in (None, 0, 1).
    model_overrides:
      mtp_hsm: false

      # This is what actually removes MTP, and nothing in the mtp_* keys can do
      # it. The depths are baked into the provider's pattern constant, whose
      # format is "<main>/<mtp>/<mtp>":
      #
      #   NEMOTRON4_NANO_HYBRID_LAYER_PATTERN = "...*EMEM-M-/*E/*E"
      #
      # The num_pattern_copies logic that mtp_num_layers feeds only runs when
      # the provider sets mtp_hybrid_override_pattern, and NM4 does not -- so
      # the constant is used verbatim and the two "*E" depths are built no
      # matter what mtp_num_layers says. Three 86-node runs died downstream of
      # that: 7758485 on the MTP loss buffer, 7760876 on the MTP branch running
      # without input_ids, 7761548 on MTP weights that do not exist.
      #
      # Dropping the separator and everything after it leaves the main decoder
      # byte-for-byte identical -- 72 layers before and after, 76 only when the
      # four MTP layers are counted -- so this removes the MTP blocks and
      # changes nothing else. parse_hybrid_pattern on a pattern with no "/"
      # returns mtp_num_depths=0, which is the documented way to say "no MTP".
      # The checkpoint keeps its MTP weights; Megatron's distributed load asks
      # for the model's keys, so unrequested ones are simply ignored.
      #
      # MTP has to go rather than merely be cheaper: the vLLM container this
      # run generates with does not support MTP, so those weights could not be
      # consumed on the generation side even if training produced them.
      #
      # It has to be set in both places. This one is the provider field, which
      # feeds layer accounting. On its own it does nothing, which is what job
      # 7762144 showed: the assertion came back unchanged, because
      # experimental_nm4_llava_provider.__post_init__ runs after
      # model_overrides is merged, and the model is built from the restored
      # checkpoint args -- `hybrid_layer_pattern=args.hybrid_layer_pattern` --
      # not from this field. The saved_args copy below is the one the model
      # actually gets; they are kept identical so the two cannot drift.
      hybrid_layer_pattern: "M-M-M*EMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEM*EMEM-M-"

      saved_args:
        # The authoritative one. __post_init__ rebuilds `args` from saved_args
        # and provide() passes args.hybrid_layer_pattern into the model, so
        # this is what decides whether the MTP blocks exist. Overriding one key
        # here is safe: _merge_model_override_value descends into mappings, so
        # the checkpoint's other saved args (vlm_checkpoint_layout among them,
        # which __post_init__ validates) are preserved. This is the same
        # channel the parent recipe already uses for attention_backend.
        hybrid_layer_pattern: "M-M-M*EMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEMEM*EMEMEM*EMEM-M-"

  generation:
    # The parent's 1024 is a math-pipeclean budget. Judged RLVR responses carry
    # a reasoning block, so they need real room. 4096 out of the 8192 total is
    # the natural split given the prompt distribution: the median prompt is
    # ~284 tokens and prompts are filtered to 4096 before the run, so every
    # surviving row has at least 4096 tokens of generation available.
    max_new_tokens: 4096
    # Gym drives generation over an OpenAI-compatible endpoint rather than the
    # in-process engine, so the server has to be exposed.
    vllm_cfg:
      expose_http_server: true
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: hermes
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 32

# =============================================================================
# Data -- the Super 3.5 production RLVR set.
#
# It is built for 64k and we run at 8192, which is survivable rather than
# ideal: sampling 20k rows gives a median prompt of ~284 tokens and a p90 of
# ~6.4k, so the great majority fit, with a long-context tail (p99 ~38k) that
# will be dropped. The mix is also well matched to what this run is for --
# genrm_simple_agent and equivalence_llm_judge are the two largest agent_refs
# in the file, so the judge fleet is what the data actually exercises.
# =============================================================================
data:
  # Deliberately null, and it would do nothing if it were not: for text rows
  # nemo_gym_data_processor returns a placeholder DatumSpec with length 0 and
  # never consults max_seq_length, because Gym assembles the real cumulative
  # prompt server-side. Overlong rows therefore cannot be filtered from config
  # -- they have to be removed from the file. filter_rlvr_by_length.py does
  # that, and TRAIN_PATH below is expected to point at its output.
  max_input_seq_length: null
  shuffle: true
  num_workers: 1
  train:
    # Name the class here, not just in data.default: update_single_dataset_config
    # only fills keys that are absent, so the parent math recipe's
    # dataset_name wins and data_path is silently dropped as an unsupported key
    # for OpenMathInstruct2Dataset -- which trains on 14M math rows instead of
    # this file. Clearing it with null does not work either, since data.train is
    # validated against a union of dataset configs that requires a str.
    # The parent's split_validation_size and seed ride along harmlessly:
    # NemoGymDataset takes **kwargs and never splits, and validation is explicit
    # below.
    dataset_name: NemoGymDataset
    data_path: null   # set by the launch script
  validation:
    data_path: null   # set by the launch script
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    processor: "nemo_gym_data_processor"
    prompt_file: null
    system_prompt_file: null

# =============================================================================
# Environment -- NeMo Gym and the judge fleet
# =============================================================================
env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    nemo_gym_log_dir: "logs/nemo_gym"
    skip_venv_if_present: true
    # Gym's default bound is 600s, measured from the moment its own 74 servers
    # are up, and at this scale that window closes while the 64 policy vLLM
    # endpoints are still capturing CUDA graphs and JIT-compiling FlashInfer
    # kernels. When it expires Gym calls shutdown() and the run produces no
    # rollouts at all: 7763933 sat at 86 nodes for 38 minutes that way, and
    # 7762681 only survived because its endpoints answered just inside 600s.
    # The margin, not the mechanism, was the difference, so pick a bound that
    # cannot be reached by a healthy startup while still failing a dead one.
    model_endpoint_readiness_timeout_seconds: 3600
    # GenRM and NL2Bash are external pools; these nodes host only the
    # Gym-managed safety judge.
    num_gpu_nodes: 2
    port_range_low: 5000
    port_range_high: 5999
    global_aiohttp_client_request_debug: true
    global_aiohttp_connector_limit: 4096
    global_aiohttp_connector_limit_per_host: 4096
    # NT4's chat template emits exactly these, so Gym's reasoning handling and
    # the invalid-tool-call penalty both line up with the model without
    # translation.
    thinking_tags:
      - "<think>"
      - "</think>"
    invalid_tool_call_patterns:
      - "<tool_call>"
      - "</tool_call>"
      - "<function_call>"
      - "</function_call>"

    # Lightning's list verbatim, so the training distribution is the Super 3.5
    # one rather than a judge-only slice of it. Every agent_ref in the RLVR file
    # was mapped to its defining config and checked against this list: it covers
    # all but five families (conversational_tool_use, finance, citation_if,
    # scicode, structured_outputs_v4), and four of those five have almost no
    # rows that fit an 8192-position context anyway.
    #
    # Widening this costs no new judge infrastructure -- Lightning serves these
    # same 33 servers from exactly the three external pools we already run
    # (genrm, nl2bash, safety). It does require a working sandbox, because
    # ns_tools, code_gen and terminus_judge call it; see SANDBOX_COMMAND in the
    # launcher for why that needed a pgrep shim.
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - resources_servers/math_with_judge/configs/math_with_judge.yaml
      - resources_servers/code_gen/configs/code_gen.yaml
      - resources_servers/workplace_assistant/configs/workplace_assistant.yaml
      - resources_servers/mcqa/configs/mcqa.yaml
      - resources_servers/instruction_following/configs/instruction_following.yaml
      - resources_servers/equivalence_llm_judge/configs/lc_judge.yaml
      - resources_servers/calendar/configs/calendar.yaml
      - resources_servers/genrm_compare/configs/genrm_compare.yaml
      - resources_servers/equivalence_llm_judge/configs/nl2bash-equivalency.yaml
      - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
      - resources_servers/single_step_tool_use_with_argument_comparison/configs/single_step_tool_use_with_argument_comparison.yaml
      - resources_servers/reasoning_gym/configs/reasoning_gym.yaml
      - resources_servers/terminus_judge/configs/terminus_judge_string_only.yaml
      - resources_servers/ns_tools/configs/ns_tools.yaml
      - resources_servers/math_formal_lean/configs/math_formal_lean_multi_turn.yaml
      # swerl_gen disabled: requires Apptainer/Singularity (not available on aarch64)
      # - resources_servers/swerl_gen/configs/swerl_gen.yaml
      - resources_servers/multichallenge/configs/multichallenge.yaml
      - resources_servers/inverse_if/configs/inverse_if.yaml
      - resources_servers/single_step_tool_use_with_argument_comparison/configs/search_pivot_single_step_tool_use_with_argument_comparison.yaml
      - resources_servers/single_step_tool_use_with_argument_comparison/configs/toolcall_schema_single_step_tool_use_with_argument_comparison.yaml
      - resources_servers/single_step_tool_use_with_argument_comparison/configs/swe_pivot_single_step_tool_use_with_argument_comparison.yaml
      - resources_servers/abstention/configs/abstention.yaml
      - resources_servers/nvarc/configs/inductive.yaml
      - resources_servers/nvarc/configs/transductive.yaml
      - resources_servers/single_step_tool_use_with_argument_comparison/configs/droid_pivot_single_step_tool_use_with_argument_comparison.yaml
      - resources_servers/equivalence_rule/configs/lc.yaml
      - resources_servers/ether0/configs/ether0.yaml
      - resources_servers/structured_outputs/configs/structured_outputs_json_yaml_xml_v1.yaml
      - resources_servers/structured_outputs/configs/structured_outputs_v3.yaml
      # Beyond Lightning's list. Both are verifier-only servers that reference
      # policy_model and nothing else, and v4 shares the structured_outputs venv
      # that v1 and v3 already build, so neither needs new infrastructure.
      # Together they are ~2.5k rows that would otherwise have no server.
      - resources_servers/structured_outputs/configs/structured_outputs_v4.yaml
      - resources_servers/citation_if/configs/citation_if.yaml
      - resources_servers/format_verification/configs/freeform_formatting.yaml
      - resources_servers/format_verification/configs/citation_format.yaml
      - resources_servers/jailbreak_detection/configs/jailbreak_detection_nemotron_combined_reward_tp8.yaml
      - resources_servers/indirect_prompt_injection/configs/indirect_prompt_injection.yaml

    policy_model:
      responses_api_models:
        vllm_model:
          num_workers: 16
          chat_template_kwargs:
            enable_thinking: true
          sequential_reasoning_allowed: false

    policy_model_reasoning_off:
      _copy: policy_model
      responses_api_models:
        vllm_model:
          num_workers: 4
          chat_template_kwargs:
            enable_thinking: false

    # --- GenRM: external TP=8 pool, 8 replicas over 16 nodes -----------------
    genrm_compare_resources_server:
      resources_servers:
        genrm_compare:
          num_rollouts_per_prompt: ${grpo.num_generations_per_prompt}
          genrm_model_server:
            type: responses_api_models
            name: genrm_model
          genrm_responses_create_params:
            max_output_tokens: 24576
            temperature: 1.0
            top_p: 0.95
          comparison_strategy: "circular"
          num_judges_per_comparison: 1
          use_principle: true
          aggregator_method: "simple_tiebreaker"
          reasoning_bonus: 0.5
          answer_bonus: 0.5
          top_percentile: 0.2
          group_reasoning_length_penalty_coeff: 0.12
          group_answer_length_penalty_coeff: 0.12
          group_style_penalty_coeff: 0.0
          default_score: 3.0
          default_ranking: 3.5
          genrm_parse_retries: 1

    # Served by the external pool; the launcher sets base_url and these local
    # settings go inactive. Retained because Gym validates the schema.
    genrm_model:
      responses_api_models:
        genrm_model:
          entrypoint: app.py
          api_key: dummy_key
          model: model
          uses_reasoning_parser: true
          return_token_id_information: false

    # --- NL2Bash / general judge: external TP=4 pool, 4 replicas over 4 nodes -
    nl2bash_judge_model:
      responses_api_models:
        local_vllm_model:
          entrypoint: app.py
          model: null   # set by the launcher
          return_token_id_information: false
          uses_reasoning_parser: false
          debug: true
          ray_worker_py_executable: /opt/ray_venvs/nemo_rl.models.generation.vllm.vllm_worker_async.VllmAsyncGenerationWorker/bin/python
          # This pool is served externally (the launcher injects base_url), and
          # app.py skips the local launch entirely when base_url is set. These
          # two keys are still required: LocalVLLMModelConfig declares
          # vllm_serve_kwargs and vllm_serve_env_vars with no defaults, so
          # omitting them makes the judge process die on a pydantic
          # ValidationError the moment Gym starts it. That is what killed job
          # 7756306 at 17:31 on 86 nodes, after the config had merged and the
          # policy and all 63 policy-vLLM engines were up.
          #
          # They describe a local serve that will not happen here, so they are
          # carried over from Lightning verbatim rather than invented: if
          # external pools are ever disabled, this is the shape that is known to
          # serve this checkpoint.
          vllm_serve_env_vars:
            VLLM_RAY_DP_PACK_STRATEGY: strict
            VLLM_USE_FLASHINFER_MOE_FP16: "0"
            VLLM_USE_FLASHINFER_MOE_FP8: "0"
            VLLM_USE_DEEP_GEMM: "0"
            VLLM_MOE_USE_DEEP_GEMM: "0"
            NCCL_MNNVL_ENABLE: "1"
          vllm_serve_kwargs:
            attention_backend: TRITON_ATTN
            tensor_parallel_size: 4
            data_parallel_size: 4
            data_parallel_size_local: 1
            pipeline_parallel_size: 1
            enable_expert_parallel: true
            enable_auto_tool_choice: true
            tool_call_parser: hermes
            gpu_memory_utilization: 0.85
            max_model_len: 131072
            max_num_seqs: 256
            enable_prefix_caching: true
            enable_chunked_prefill: true
            model_loader_extra_config:
              enable_multithread_load: true
              num_threads: 112
            compilation_config:
              cudagraph_capture_sizes: [1,2,4,8,16,32,64,128,256]

    equivalence_llm_judge:
      resources_servers:
        equivalence_llm_judge:
          judge_model_server:
            name: nl2bash_judge_model
          judge_responses_create_params:
            max_output_tokens: 8192

    lc_judge:
      resources_servers:
        equivalence_llm_judge:
          judge_model_server:
            name: nl2bash_judge_model
          judge_responses_create_params:
            max_output_tokens: 8192

    # --- Safety: Gym-managed, 2 nodes, TP=4 DP=2 -----------------------------
    safety_judge_model:
      responses_api_models:
        local_vllm_model:
          entrypoint: app.py
          model: null   # set by the launcher
          return_token_id_information: false
          uses_reasoning_parser: false
          debug: true
          # Required with no default, same as nl2bash_judge_model above.
          vllm_serve_env_vars:
            VLLM_RAY_DP_PACK_STRATEGY: strict
            VLLM_USE_DEEP_GEMM: "0"
            VLLM_MOE_USE_DEEP_GEMM: "0"
          vllm_serve_kwargs:
            attention_backend: TRITON_ATTN
            tensor_parallel_size: 4
            data_parallel_size: 2
            data_parallel_size_local: 1
            pipeline_parallel_size: 1
            gpu_memory_utilization: 0.85
            max_model_len: 96000
            max_num_seqs: 256
            model_loader_extra_config:
              enable_multithread_load: true
              num_threads: 112
            compilation_config:
              cudagraph_capture_sizes: [1,2,4,8,16,32,64,128,256]

    jailbreak_detection:
      resources_servers:
        jailbreak_detection:
          judge_model_server:
            type: responses_api_models
            name: safety_judge_model

    # --- Math: judged by the policy itself, as in Super 3.5 ------------------
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model
          should_use_judge: false

    # The remaining three servers in config_paths need their judge pointed
    # somewhere, and each ships a default that is wrong here. Lightning sends
    # all three to nl2bash_judge_model (the Qwen3-235B pool) and these match it.
    #
    # inverse_if is the one that actually fails closed: its default names a
    # 'judge_model' server that nothing defines, so Gym raises
    # ServerRefNotFoundError while merging the config and the run dies. That
    # cost job 7755025 its 86 nodes 15 minutes in, after the policy checkpoint
    # had loaded and all 63 vLLM engines were up.
    inverse_if:
      resources_servers:
        inverse_if:
          judge_model_server:
            type: responses_api_models
            name: nl2bash_judge_model

    # abstention defaults to genrm_model, which is a pairwise comparison reward
    # model rather than a judge, and multichallenge defaults to policy_model,
    # which would have the policy grade its own rollouts and spend policy
    # generation capacity doing it. Both validate, so neither would have been
    # caught by a config error -- they would just have been quietly wrong.
    abstention:
      resources_servers:
        abstention:
          abstention_reward: 0.5
          judge_model_server:
            type: responses_api_models
            name: nl2bash_judge_model
          judge_responses_create_params:
            max_output_tokens: 8192

    multichallenge:
      resources_servers:
        multichallenge:
          judge_model_server:
            type: responses_api_models
            name: nl2bash_judge_model
          judge_responses_create_params:
            max_output_tokens: 8192

    # Carried over from Lightning unchanged. code_gen runs unit tests in the
    # sandbox rather than calling a judge, so it needs process count and timeout
    # rather than a model server.
    code_gen:
      resources_servers:
        code_gen:
          num_processes: 2048
          unit_test_timeout_secs: 10
          debug: false

logger:
  log_dir: logs/nt4nano-rlvr-86n4g-gym
  wandb:
    project: nemo-rl-nt4nano
    name: nt4nano-rlvr-86n4g-gym
