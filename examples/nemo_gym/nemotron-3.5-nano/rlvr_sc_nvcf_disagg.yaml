# =============================================================================
# Nemotron 3.5 Nano — Amplified Dolphin RLVR, all-features arm, hosted judges
# =============================================================================
# Everything the convergence campaign tested separately, in one config:
#
#   SingleController            rlvr_sc.yaml
#   streaming forward/backward  rlvr_sc.yaml (min_groups_for_streaming_train)
#   nccl_reshard refit          rlvr_sc.yaml
#   ready_first sampler, lag 1  readyfirst_cpu_rdma.yaml
#   CPU RDMA data plane         readyfirst_cpu_rdma.yaml (mooncake_cpu)
#   NVCF-hosted judges          nvcf_judges.yaml
#   disaggregated sandboxes     environment-only; see readyfirst_cpu_rdma.yaml
#
# Model, parallelism, batch shape, sequence length, MTP settings and the Gym
# blend are inherited unchanged through rlvr.yaml, so reward and loss curves
# stay comparable against the in_order arms on the same blend.
#
# To serve the judges on the allocation instead, drop nvcf_judges.yaml from the
# defaults below and launch through nano35_launch.sh without HOSTED_JUDGES=1.
# The local judge settings live in rlvr.yaml and are never touched here, so they
# come back intact; that shape needs 86 nodes rather than 66.
#
# Ordering in `defaults` is load-bearing: parents merge left to right, and
# readyfirst_cpu_rdma.yaml replaces async_rl rather than merging with it, so it
# has to come after rlvr_sc.yaml. nvcf_judges.yaml touches only judge
# base_url/api_key/model, disjoint from both.
#
# Entrypoint: examples/run_grpo_single_controller.py. Launch with
# launch_rlvr_sc_nvcf_disagg.sh, which carries the 66-node split -- no judge
# hetgroup and 2 gym nodes rather than 6, because hosting all three judges
# frees both the hetgroup and the judge vLLMs that ran on the gym nodes.
# =============================================================================
defaults:
  - rlvr_sc.yaml
  - nvcf_judges.yaml
  - readyfirst_cpu_rdma.yaml
  # gym_fanout_lag4.yaml is deliberately NOT inherited here either. Job 3657252
  # was submitted before that file existed and is the reference this comparison
  # is anchored to, so inheriting it would make a relaunched NVCF arm differ
  # from the very run it is meant to reproduce. Both arms therefore take lag,
  # in-flight depth and timeouts from readyfirst_cpu_rdma.yaml unchanged.
