# =============================================================================
# ready_first sampling at lag 1 + CPU RDMA rollouts — mergeable fragment
# =============================================================================
# The feature deltas that turn the SC dolphin recipe into the all-features arm.
# Kept as a fragment rather than inlined into its one consumer today
# (rlvr_sc_nvcf_disagg.yaml, 66 nodes) so this bundle composes onto rlvr_sc.yaml
# independently of judge hosting -- swapping judges in or out is then a change to
# a recipe's `defaults` list, not a re-edit of these values.
#
# List this AFTER rlvr_sc.yaml in a recipe's `defaults`. Ordering is
# load-bearing: parents merge left to right, and the async_rl block below
# replaces its parent rather than merging with it, which only works if the
# parent has already been merged in.
#
# This file has NO `defaults` key on purpose. It is a fragment, so a recipe can
# list it alongside another parent without dragging rlvr.yaml in behind it and
# re-applying base values over the SC overlay.
#
# Disaggregated sandboxes are not here, and not anywhere else in NeMo-RL YAML:
# at the pinned Gym commit, resources_servers/ns_tools/configs/ns_tools.yaml
# reads the backend switch and every pool setting straight from the environment
# (NS_TOOLS_SANDBOX_TYPE, NS_SANDBOX_POOL_REF / _SIZE / _FALLBACK / _TTL_S,
# NS_SANDBOX_IMAGE, OPENSANDBOX_BASE_URL / _API_KEY), and math_formal_lean does
# the same with MATH_FORMAL_LEAN_BACKEND. Restating any of it here would create
# a second place to keep in sync for no gain. Each arm's launcher owns those.
# =============================================================================

# =============================================================================
# Loss — the importance ratio has to become real under ready_first
# =============================================================================
# validate_single_controller_config rejects ready_first unless
# force_on_policy_ratio is false, and the reason is the sampler's whole point:
# it fills a batch from whatever is ready across weight versions, so a batch is
# a mixture of policies rather than in_order's single stamped target step.
# Forcing r_t = 1.0 would then discard a real policy gap instead of a small one.
#
# Turning it off makes the inherited correction live for the first time:
# use_importance_sampling_correction and truncated_importance_sampling_ratio=5
# are inert under force_on_policy_ratio=true, because the ratio never varies.
# So watch token_mult_prob_error and is_oob_ratio on these arms specifically --
# they are measuring something here, and were measuring nothing on the arms
# that force the ratio.
#
# This is the one confound these arms cannot remove by config: sampler is the
# only *intended* variable against the in_order arms, but the loss ratio moves
# with it.
# =============================================================================
loss_fn:
  force_on_policy_ratio: false

# =============================================================================
# SingleController async RL — ready_first at a staleness window of 1
# =============================================================================
# _override_ rather than merging, and it is load-bearing even where the numbers
# below match the parent: ready_first reads max_staleness_versions, not the
# max_lookahead_versions in_order reads, and every sampler config is
# extra="allow". A plain merge would leave the inherited max_lookahead_versions
# sitting in a ready_first block where it means nothing. _override_ is only
# honoured on a top-level key, so the whole async_rl block is restated rather
# than just the sampler.
#
# What these arms isolate: both samplers gate admission identically, so at the
# same lag generation runs at most one dispatch batch ahead either way. The
# difference is selection. in_order drains one target step at a time and stamps
# every cohort with the exact optimizer step that will train on it; ready_first
# takes whatever is ready across weight versions, so a straggler that misses
# its window is still trained on instead of being discarded -- which is what
# makes it the arm to reach for when generation tail latency, not policy
# freshness, is the problem.
# =============================================================================
async_rl:
  _override_: true
  sampler:
    name: ready_first
    max_staleness_versions: 1
  recompute_kv_cache_after_weight_updates: false

  # Unchanged from the in_order arm: 512 / 32 = 16 streaming chunks per
  # optimizer step, so streaming behaves the same and only selection differs.
  min_groups_for_streaming_train: 32

  # The current cohort plus its single admitted lookahead cohort. Admission
  # stops generation at trainer_version + 1, so anything above 512 * 2 is
  # unreachable. Also the hard floor: ready_first is a gated sampler and
  # requires num_prompts_per_step * (staleness + 1) = 1024, below which the
  # rollout pump deadlocks waiting for buffer slots.
  max_inflight_prompts: 1024
  max_buffered_rollouts: 1024

  # Restated at the in_order arm's values.
  rollout_failure:
    max_infra_attempts_per_prompt: 5
    max_data_attempts_per_prompt: 2
    backoff_base_s: 1.0
    max_backoff_s: 30.0
    max_consecutive_dropped_prompts: 32
    max_skipped_prompts: 32
    on_dropped_prompt: replace
    max_replacement_attempts: 1
    replacement_reserve_prompts: 1
    min_step_batch_fraction: 0.9
    nemo_gym:
      rollout_timeout_s: 1800.0
  stall_watchdog:
    interval_s: 30.0
    stall_timeout_s: 2400.0
    stall_action: warn
    gym_subprocess_check: true

# =============================================================================
# TransferQueue data plane — rollouts over CPU RDMA
# =============================================================================
# mooncake_cpu carries rollouts over CPU RDMA and has no TCP fallback: it
# raises at data-plane setup if no RDMA device is usable rather than degrading
# silently. The simple backend's num_storage_units is inherited and unread on
# these arms; set backend=simple to fall back to the SimpleStorage Ray actors.
# =============================================================================
data_plane:
  backend: mooncake_cpu

# =============================================================================
# Checkpointing — off, and not by preference
# =============================================================================
# CPU RDMA and checkpointing are mutually exclusive on the SingleController
# path today, so an arm on mooncake_cpu has to give one up:
#
#   Every built-in sampler declares supports_buffer_checkpoint, so SC setup
#   requires checkpointing.save_data_plane=true whenever checkpointing is
#   enabled -- otherwise a resume would silently drop completed, unconsumed
#   rollouts. Only the simple backend can write that snapshot
#   (_CHECKPOINTABLE_BACKENDS), so mooncake_cpu with checkpointing enabled is
#   refused outright rather than degraded.
#
# CPU RDMA is what these arms exist to exercise, so checkpointing loses. Be
# aware of the cost: a crash restarts from step 0, there is no eval rung to
# score, and a run is only practical over a short step budget. To trade back,
# override at launch (no config edit needed):
#
#   data_plane.backend=simple checkpointing.enabled=true \
#     checkpointing.save_data_plane=true
#
# save_data_plane is cleared as well as enabled, not only for tidiness: SC setup
# checks the flag against the backend BEFORE it checks whether checkpointing is
# enabled at all, so inheriting true from rlvr_sc.yaml would fail these arms at
# setup even with checkpointing off.
# =============================================================================
checkpointing:
  enabled: false
  save_data_plane: false
