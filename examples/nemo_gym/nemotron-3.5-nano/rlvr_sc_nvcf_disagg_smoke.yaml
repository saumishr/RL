# =============================================================================
# Nemotron 3.5 Nano — all-features arm at 8 nodes, for smoke testing only
# =============================================================================
# The 66-node arm with the batch shape shrunk to the smallest one that still
# exercises every feature in it. Not a training recipe: two steps at 8 prompts
# converges nothing and the numbers are not comparable to any campaign arm.
#
# What it does prove, which is what a smoke run is for: the allocation comes up,
# the SingleController wires its actors, the NVCF judges answer, the sandbox pool
# grants claims, mooncake_cpu finds an RDMA device, nccl_reshard completes a
# refit, and ready_first admits and trains a step. Those are the failures that
# cost hours at 66 nodes, and every one of them surfaces here in minutes.
#
# Node shape (set by the launcher, not here): 4 train + 2 gen + 2 gym.
# 4 train nodes is the floor, not a choice -- 16 GPUs is exactly
# TP=4 x CP=4 x PP=1, so DP=1. Fewer cannot hold one model replica.
#
# Launch it the same way as the full arm, with the smaller node counts and a
# pool claim sized to match:
#
#   EXP_NAME=allfeatures-smoke \
#   NUM_TRAIN_NODES=4 NUM_GEN_NODES=2 NUM_GYM_NODES=2 \
#   NS_SANDBOX_POOL_SIZE=8 WALLTIME=02:00:00 \
#   CONFIG_PATH=examples/nemo_gym/nemotron-3.5-nano/rlvr_sc_nvcf_disagg_smoke.yaml \
#   MODEL_PATH=... TRAIN_PATH=... VAL_PATH=... CONTAINER=... \
#   PERSISTENT_CACHE=... SLURM_ACCOUNT=... SLURM_PARTITION=... \
#   bash examples/nemo_gym/nemotron-3.5-nano/launch_rlvr_sc_nvcf_disagg.sh
#
# The parent arm's own header documents the credentials and the pool contract;
# both apply here unchanged, because a smoke run that skips them tests less than
# it appears to.
# =============================================================================
defaults:
  - rlvr_sc_nvcf_disagg.yaml

# =============================================================================
# Batch shape — the smallest that still assembles a streaming step
# =============================================================================
# 8 prompts x 16 generations = 128 sequences, holding the parent's identity
# train_global_batch_size = num_prompts_per_step * num_generations_per_prompt.
# Two steps: one to refit from, one to train on refit weights, which is the
# minimum that exercises nccl_reshard rather than just startup.
# =============================================================================
grpo:
  num_prompts_per_step: 8
  max_num_steps: 2

policy:
  train_global_batch_size: 128

# =============================================================================
# Streaming and backpressure, rescaled to the smaller cohort
# =============================================================================
# Merged into the parent's async_rl rather than overriding it: the sampler block
# and the drop budget must survive from readyfirst_cpu_rdma.yaml. Do NOT add
# _override_ here -- it would drop ready_first back to the inherited sampler.
#
# min_groups_for_streaming_train 8 / 2 = 4 chunks per step, matching the
# parent's 512 / 32 = 16 in kind if not in count, so streaming actually streams
# instead of assembling each step in one shot.
#
# max_buffered_rollouts is at ready_first's hard floor of
# num_prompts_per_step * (max_staleness_versions + 1) = 8 * 2 = 16. Below it the
# rollout pump deadlocks waiting for buffer slots, and validation says so.
# =============================================================================
async_rl:
  min_groups_for_streaming_train: 2
  max_inflight_prompts: 16
  max_buffered_rollouts: 16
